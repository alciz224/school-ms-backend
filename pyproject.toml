[project]
name = "school-ms-backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "django>=6.0.1",
    "django-cors-headers>=4.9.0",
    "django-filter>=25.2",
    "djangorestframework>=3.16.1",
    "djangorestframework-simplejwt>=5.5.1",
    "drf-spectacular>=0.29.0",
    "phonenumbers>=9.0.22",
    "pillow>=12.2.0",
    "weasyprint>=69.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-django>=4.11.1",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-q --tb=short"
# ref/ contains historical/reference code and is not part of the active project.
# Exclude it from test discovery to avoid importing non-installed apps.
norecursedirs = [
    "ref",     # helper/reference code
    "tables",   # helper specs and exports
    "auth/tables",  # API contract helper yaml tables
    "tmp_rovodev_*",  # local temporary files
]

