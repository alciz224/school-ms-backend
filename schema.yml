components:
  schemas:
    AcademicYear:
      type: object
      description: Serializer for AcademicYear model.
      properties:
        id:
          type: integer
          readOnly: true
        code:
          type: string
          readOnly: true
          description: Code court (ex. 2024-2025) - Auto-generated if not provided
        start_year:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
          description: Année de début (ex. 2024)
        end_year:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
          description: Année de fin (ex. 2025)
        is_current:
          type: boolean
          description: Année académique en cours
        status:
          allOf:
          - $ref: '#/components/schemas/AcademicYearStatusEnum'
          description: |-
            Statut de l'année académique

            * `DRAFT` - Draft
            * `ACTIVE` - Active
            * `ARCHIVED` - Archived
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - code
      - created_at
      - end_year
      - id
      - start_year
      - updated_at
    AcademicYearStatusEnum:
      enum:
      - DRAFT
      - ACTIVE
      - ARCHIVED
      type: string
      description: |-
        * `DRAFT` - Draft
        * `ACTIVE` - Active
        * `ARCHIVED` - Archived
    AdminUserCreate:
      type: object
      description: |-
        Input serializer for creating a user.

        Matches frontend CreateAdminUserInput.
      properties:
        email:
          type: string
          format: email
          nullable: true
        phone:
          type: string
          nullable: true
          maxLength: 20
        first_name:
          type: string
          maxLength: 50
        last_name:
          type: string
          maxLength: 50
        is_active:
          type: boolean
          default: true
        is_staff:
          type: boolean
          default: false
      required:
      - first_name
      - last_name
    AdminUserCreateResponse:
      type: object
      description: Detail response with the generated password (create only).
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
          nullable: true
          title: Email address
          description: Email address for login and notifications.
        phone:
          type: string
          readOnly: true
          nullable: true
          description: Phone number in international format (+224...).
        first_name:
          type: string
          readOnly: true
        last_name:
          type: string
          readOnly: true
        is_active:
          type: boolean
          readOnly: true
          title: Active
          description: Indicates if the account is active.
        is_staff:
          type: boolean
          readOnly: true
          title: Staff
          description: Can access Django admin.
        date_joined:
          type: string
          format: date-time
          readOnly: true
        last_login:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
          title: Last modified
        is_deleted:
          type: boolean
          readOnly: true
        profiles:
          allOf:
          - $ref: '#/components/schemas/UserProfiles'
          readOnly: true
        password:
          type: string
          readOnly: true
      required:
      - date_joined
      - email
      - first_name
      - id
      - is_active
      - is_deleted
      - is_staff
      - last_login
      - last_name
      - password
      - phone
      - profiles
      - updated_at
    AdminUserDetail:
