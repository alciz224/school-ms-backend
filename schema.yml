      tags:
      - report-cards
      security:
      - jwtAuth: []
      - cookieAuth: []
      - Bearer: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ReportCardList'
          description: ''
    post:
      operationId: report_cards_create
